name: ZAP
on: workflow_dispatch

jobs:
  zap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          grep -m1 "model name" /proc/cpuinfo
          nproc
          free -m | head -2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build modules (setup, not timed)
        run: ./mvnw -B --no-transfer-progress install -DskipTests -pl '!spring-boot-admin-docs'

      - name: Start app
        run: |
          nohup java -jar spring-boot-admin-samples/spring-boot-admin-sample-servlet/target/spring-boot-admin-sample-servlet.jar --spring.profiles.active=insecure > app.log 2>&1 &

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            echo "http=$CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "302" ]; then exit 0; fi
            sleep 3
          done
          echo "app did not start"; tail -n 50 app.log; exit 1

      - name: ZAP baseline scan
        run: |
          mkdir zap-out && chmod 777 zap-out
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap-baseline.py -t http://localhost:8080 -J zap-report.json -I

      - name: Verify scan output
        run: test -s zap-out/zap-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: zap-result
          path: zap-out/zap-report.json
