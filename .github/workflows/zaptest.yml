name: ZAP test
on: workflow_dispatch

jobs:
  zaptest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build modules (setup, not timed)
        run: ./mvnw -B --no-transfer-progress install -DskipTests -pl '!spring-boot-admin-docs'

      - name: Start app
        run: |
          nohup java -jar spring-boot-admin-samples/spring-boot-admin-sample-servlet/target/spring-boot-admin-sample-servlet.jar --spring.profiles.active=insecure > app.log 2>&1 &

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            echo "http=$CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "302" ]; then exit 0; fi
            sleep 3
          done
          echo "app did not start"; tail -n 50 app.log; exit 1

      - name: Variant A (JSON, rule 10010 ignored)
        continue-on-error: true
        run: |
          mkdir -p out-a && chmod 777 out-a
          printf '10010\tIGNORE\t(Cookie No HttpOnly Flag)\n' > out-a/rules.tsv
          docker run --rm --network host -v "$PWD/out-a:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap-baseline.py -t http://localhost:8080 -J zap-report.json -c rules.tsv -I 2>&1 | tee out-a/console.log

      - name: Variant B (XML report)
        continue-on-error: true
        run: |
          mkdir -p out-b && chmod 777 out-b
          docker run --rm --network host -v "$PWD/out-b:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap-baseline.py -t http://localhost:8080 -x zap-report.xml -I 2>&1 | tee out-b/console.log

      - name: Variant C (HTML report)
        continue-on-error: true
        run: |
          mkdir -p out-c && chmod 777 out-c
          docker run --rm --network host -v "$PWD/out-c:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 \
            zap-baseline.py -t http://localhost:8080 -r zap-report.html -I 2>&1 | tee out-c/console.log

      - name: Which variants produced a report
        if: always()
        run: ls -la out-a out-b out-c

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-test
          path: |
            out-a
            out-b
            out-c
          if-no-files-found: ignore
